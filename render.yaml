# Blueprint do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: sincronizador-pregacoes
    runtime: docker
    plan: free # grátis: dorme depois de 15 min parado (a primeira abertura demora cerca de 1 minuto)
    healthCheckPath: /healthz
    envVars:
      - key: SENHA # a senha que vocês dois vão usar pra entrar
        sync: false
      - key: SEGREDO_COOKIE
        generateValue: true
